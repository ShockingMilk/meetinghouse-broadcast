[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetinghouse-broadcast"
version = "0.1.0"
description = "OBS, Zoom, and PTZ camera automation"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "obsws-python>=1.8,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
meetinghouse-broadcast = "broadcast_controller.main:main"

[tool.setuptools.packages.find]
where = ["src"]
