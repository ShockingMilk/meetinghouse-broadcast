monitoring:
  schema_version: "1.0"

  # Relative paths are resolved from the project root.
  output_directory: logs/monitoring

  # Maximum size of an individual JSONL segment.
  max_file_bytes: 5242880

  # Number of segments retained per session.
  backup_count: 10

  default_mode: passive

  modes:
    passive:
      allow_control_actions: false

      collectors:
        network:
          enabled: true
          interval_seconds: 5

        system:
          enabled: true
          interval_seconds: 15

        obs:
          enabled: true
          interval_seconds: 5

        camera:
          enabled: true
          interval_seconds: 10

    active:
      allow_control_actions: true

      collectors:
        network:
          enabled: true
          interval_seconds: 2

        system:
          enabled: true
          interval_seconds: 5

        obs:
          enabled: true
          interval_seconds: 2

        camera:
          enabled: true
          interval_seconds: 2

    diagnostic:
      allow_control_actions: false

      collectors:
        network:
          enabled: true
          interval_seconds: 5

          # Connectivity checks generate network traffic.
          # They only run when explicitly enabled.
          diagnostics_enabled: false
          connectivity_timeout_seconds: 3

          # Example targets; uncomment and configure when needed.
          # dns_test_hosts:
          #   - example.com
          #
          # tcp_test_targets:
          #   - host: 192.168.1.1
          #     port: 80

        system:
          enabled: true
          interval_seconds: 5

        obs:
          enabled: true
          interval_seconds: 5

        camera:
          enabled: true
          interval_seconds: 5

          # Diagnostic-only RTSP listener check.
          rtsp_tcp_probe_enabled: false
          rtsp_host: ""
          rtsp_port: null
          connectivity_timeout_seconds: 3